[package]
name = "astro-calc-build"
version = "0.1.0"
description = "Installs the JPL ephemeris files for astro-calc-core: pick a date-range tier, download, verify and build the station table"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Neil Gardner"]
repository = "https://github.com/neilg63/astro-calc-core"
readme = "README.md"

[[bin]]
name = "astro-calc-build"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
astro-calc-core = { path = "../..", version = "0.2.0" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
ureq = "3.5.2"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
