[package]
name = "astro_ephem_core"
version = "0.1.0"
description = "Pure-Rust ephemeris core: planetary positions, angles, ayanamshas, rise/set and stations from JPL data"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
chrono = { workspace = true }
julian_day_converter = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
memmap2 = "0.9"

[dev-dependencies]
serde_json = "1"
