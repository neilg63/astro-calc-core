[package]
name = "astro-calc-core"
version = "0.1.0"
description = "Pure-Rust ephemeris core: planetary positions, angles, ayanamshas, rise/set and stations from JPL data"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Neil Gardner"]
readme = "README.md"
repository = "https://github.com/neilg63/astro-calc-core"

[features]
default = ["mmap"]
# Memory-map ephemeris files instead of reading them into memory. Turn off for WebAssembly.
mmap = ["dep:memmap2"]
serde = ["dep:serde"]

[dependencies]
chrono = "0.4"
julian_day_converter = "0.4.6"
fuzzy-datetime = "0.1.4"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
serde_json = "1"
