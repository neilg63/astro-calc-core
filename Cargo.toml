[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Neil Gardner"]

[workspace.dependencies]
chrono = "0.4"
julian_day_converter = "0.4.6"
fuzzy-datetime = "0.1.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
